[project]
name = "zte-router-gateway"
version = "0.2.0"
description = "中兴 SR6110 单会话复用网关"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
zte-router-gateway = "zte_router_gateway:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
